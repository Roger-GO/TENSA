# Monthly dependency updates for the three things that carry dependencies: the
# Python package (server/pyproject.toml), the web UI (web/pnpm-lock.yaml), and
# the workflows themselves. Each ecosystem gets one grouped pull request a
# month, with every kind of update in it, so there are three to read and not a
# dozen. CI runs on every one of these pull requests, so a bump that breaks the
# tests never lands unnoticed. The security audit is a separate workflow
# (audit.yml) because advisories appear without any commit.
version: 2

updates:
  - package-ecosystem: pip
    directory: /server
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
    # The package is a library, so its ranges stay wide: a requirement is raised
    # only when the newest release is outside it. The default raises the lower
    # bound to whatever is newest (uvicorn >=0.54, hatchling >=1.32.4) and makes
    # every user of the library take it, for no reason the code has.
    versioning-strategy: increase-if-necessary
    # FastAPI documents that a minor release can break callers, which is why
    # pyproject.toml caps it at the next minor after the newest one the suite
    # ran against. A pull request that raises the cap is read and run against
    # the whole suite by a person, and not merged because it is green.
    groups:
      python:
        patterns:
          - "*"
    ignore:
      # ANDES upgrades are deliberate (AGENTS.md): a new minor or major needs
      # the curl walkthrough re-run by hand, so only patch releases are proposed.
      - dependency-name: andes
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      # juliacall (the sienna extra) is pinned to the release whose PythonCall
      # the shipped Julia Manifest holds; a new one needs a new Manifest too.
      - dependency-name: juliacall

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
    groups:
      web:
        patterns:
          - "*"
    ignore:
      # @types/node describes the API of one major of Node, and it follows the
      # oldest Node the UI supports (engines in web/package.json, the one CI
      # runs), so that a configuration or a test calling what that Node lacks
      # does not type-check. Its next major comes with that floor, by hand.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns:
          - "*"
