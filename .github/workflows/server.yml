name: server

on:
  push:
    branches: [main, "improve/**"]
    paths:
      - "server/**"
      - "web/**"
      - ".github/workflows/server.yml"
      - "scripts/**"
  pull_request:
    paths:
      - "server/**"
      - "web/**"
      - ".github/workflows/server.yml"
      - "scripts/**"
  workflow_dispatch:
  # publish.yml runs this whole workflow before it uploads a release.
  workflow_call:

permissions:
  contents: read

jobs:
  # An editable install no longer needs the UI, but a checkout serves the SPA
  # from ../web/dist, so the real `tensa serve` in the smoke test serves a page
  # instead of warning that there is none. Build it once here and hand it to
  # every test leg instead of rebuilding it six times.
  web-dist:
    name: build web/dist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build web/dist
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Upload web/dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1
          if-no-files-found: error

  # Static checks run once, on one interpreter (mypy's python_version is pinned
  # to 3.12 in pyproject.toml anyway), so a lint failure does not hide the
  # results of the test legs and the other way round.
  lint:
    name: lint + types + GUI parity
    needs: web-dist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/pyproject.toml

      - name: Download web/dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Install tensa with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./server[dev]"

      - name: ruff + mypy
        run: bash ./scripts/ci-matrix.sh lint

      # GUI-parity ledger. Fails when a new route lands without an
      # x-tensa-gui-location tag, when a 'none'-tagged route has no deferral
      # reason, or when a WS route / static mount lacks a
      # '# parity-reviewed: <date>' marker. Runs after the install step so the
      # app (and its OpenAPI schema) imports cleanly.
      - name: GUI-parity ledger check
        working-directory: server
        run: PYTHONPATH=src python ../scripts/check_gui_parity.py

  # Linux runs the whole unit + integration suite. macOS (Apple silicon) and
  # Windows run the unit tests plus the smoke test (real `tensa serve`, real
  # worker, IEEE 14 PF and a short TDS), which is the path where the operating
  # systems differ. Coverage is measured on one Linux leg only; it goes to the
  # job summary and an artifact, nowhere else.
  test:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: web-dist
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        python: ["3.12", "3.13"]
        include:
          - os: ubuntu-latest
            python: "3.12"
            coverage: true
    defaults:
      run:
        # Git Bash on Windows, so one set of commands serves every leg.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: server/pyproject.toml

      - name: Download web/dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Install tensa with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./server[dev]"

      # ANDES generates Python for every model on first use (about 2 MB under
      # ~/.andes/pycode). Keyed on the resolved ANDES version because
      # pyproject.toml only pins a range.
      - name: Resolve ANDES version
        id: andes
        run: |
          version="$(python -c "from importlib.metadata import version; print(version('andes'))")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache ANDES generated code
        uses: actions/cache@v4
        with:
          path: ~/.andes/pycode
          key: andes-pycode-${{ runner.os }}-${{ runner.arch }}-py${{ matrix.python }}-andes${{ steps.andes.outputs.version }}

      - name: Full suite with coverage
        if: runner.os == 'Linux' && matrix.coverage
        run: >
          bash ./scripts/ci-matrix.sh full
          --cov --cov-report=term:skip-covered --cov-report=xml --cov-report=html

      - name: Full suite
        if: runner.os == 'Linux' && !matrix.coverage
        run: bash ./scripts/ci-matrix.sh full

      - name: Unit tests
        if: runner.os != 'Linux'
        run: bash ./scripts/ci-matrix.sh unit

      - name: Smoke test
        if: runner.os != 'Linux'
        run: bash ./scripts/ci-matrix.sh smoke

      - name: Coverage summary
        if: matrix.coverage
        working-directory: server
        run: |
          # A worker or server process that exits after pytest-cov has combined
          # its data leaves one more file; fold it in before reporting.
          coverage combine --append --quiet >/dev/null 2>&1 || true
          {
            echo "### Server coverage (Linux, Python ${{ matrix.python }})"
            echo
            coverage report --format=markdown --skip-covered
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: matrix.coverage && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: |
            server/coverage.xml
            server/htmlcov
          retention-days: 14
          if-no-files-found: ignore

  # The acceptance suite is end to end: every test starts its own `tensa serve`
  # on a free port with a throwaway workspace and talks to it over HTTP and
  # WebSocket (streaming TDS, abort, the OpenAPI descriptions), and
  # `walkthrough.sh` drives the whole flow with curl alone. There is nothing to
  # start here. It runs real ANDES simulations and is slow, so it stays on one
  # Linux leg (the smoke test above covers the operating-system differences),
  # and it does not wait for the other jobs: it needs neither the UI bundle nor
  # their results.
  acceptance:
    name: acceptance (real server, Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/pyproject.toml

      - name: Install tensa with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./server[dev]"

      # Same key as the Linux Python 3.12 test leg, so the two share one entry.
      - name: Resolve ANDES version
        id: andes
        run: |
          version="$(python -c "from importlib.metadata import version; print(version('andes'))")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache ANDES generated code
        uses: actions/cache@v4
        with:
          path: ~/.andes/pycode
          key: andes-pycode-${{ runner.os }}-${{ runner.arch }}-py3.12-andes${{ steps.andes.outputs.version }}

      - name: Acceptance tests
        run: bash ./scripts/ci-matrix.sh acceptance
