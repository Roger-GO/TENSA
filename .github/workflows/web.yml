name: web

on:
  push:
    branches: [main, "feat/**", "improve/**"]
    paths:
      - "web/**"
      # The e2e job drives the real server, so a server change can break it.
      - "server/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - "server/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:
  # publish.yml runs this whole workflow before it uploads a release.
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: typecheck + lint + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: pnpm typecheck
        run: pnpm typecheck

      - name: pnpm lint
        run: pnpm lint

      - name: pnpm format:check
        run: pnpm format:check

      # Vitest with the v8 coverage provider: the summary lands in this log and
      # coverage/ (HTML + lcov) is uploaded below. No external service.
      - name: pnpm test (with coverage)
        run: pnpm test:coverage

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: web/coverage
          retention-days: 14
          if-no-files-found: ignore

      - name: pnpm build
        run: pnpm build

  # The Playwright suite drives the real UI against a real `tensa serve`, with
  # nothing mocked. The substrate serves the built UI itself (a checkout serves
  # ../web/dist), so there is one server and one origin, and the bundle under
  # test is the one a user gets from pip. See web/playwright.config.ts.
  e2e:
    name: e2e (Playwright, real substrate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_PORT: "8765"
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/pyproject.toml

      - name: Build the UI
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install tensa
        run: |
          python -m pip install --upgrade pip
          pip install -e ./server

      # Same key as the server workflow's Linux Python 3.12 leg.
      - name: Resolve ANDES version
        id: andes
        run: |
          version="$(python -c "from importlib.metadata import version; print(version('andes'))")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache ANDES generated code
        uses: actions/cache@v4
        with:
          path: ~/.andes/pycode
          key: andes-pycode-${{ runner.os }}-${{ runner.arch }}-py3.12-andes${{ steps.andes.outputs.version }}

      # As in the server workflow: stamps the cache so the server started below
      # does not check it in the background while the first spec loads a case.
      - name: Check ANDES generated code
        run: tensa warm-cache --quick --incremental

      - name: Install Chromium
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      # A fresh workspace, which the server seeds with the example cases the
      # tests open. Every page load opens a session. A tab that a person closes
      # ends its session as it goes, but a page the test runner closes does not,
      # so each test ends the ones its pages opened (tests/e2e/fixtures.ts); the
      # cap is raised above the default of 4 for a test that holds several.
      - name: Start the substrate
        run: |
          workspace="$RUNNER_TEMP/tensa-e2e-workspace"
          log="$RUNNER_TEMP/tensa-e2e-server.log"
          mkdir -p "$workspace"
          nohup tensa serve --port "$E2E_PORT" --workspace "$workspace" --max-sessions 32 \
            > "$log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl --silent --fail "http://127.0.0.1:$E2E_PORT/openapi.json" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "the substrate did not start within 60 s" >&2
          cat "$log" >&2
          exit 1

      - name: Run the e2e tests
        working-directory: web
        env:
          E2E_BASE_URL: http://127.0.0.1:${{ env.E2E_PORT }}
          E2E_NO_WEBSERVER: "1"
        run: pnpm test:e2e

      - name: Upload the Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 14
          if-no-files-found: ignore

      - name: Show the substrate log
        if: ${{ failure() }}
        run: cat "$RUNNER_TEMP/tensa-e2e-server.log" || true
