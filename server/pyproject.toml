[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tensa"
version = "0.4.0"
description = "TENSA: an interactive web workbench for power system simulation, built on ANDES"
readme = "README.md"
license = { file = "../LICENSE" }
requires-python = ">=3.12"
authors = [
    { name = "Roger Gracia", email = "rollerg97@gmail.com" },
]
keywords = ["tensa", "power-systems", "andes", "simulation", "fastapi", "websocket"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Framework :: FastAPI",
]

# Runtime dependencies. Pin ranges per AGENTS.md and ANDES_VERSIONS.md.
# ANDES upgrades are deliberate; never accept an automatic minor bump
# without re-running the curl walkthrough in CI.
dependencies = [
    "fastapi>=0.119,<0.120",
    "uvicorn[standard]>=0.30",
    "pyarrow>=17",
    "pydantic>=2,<3",
    "andes>=2.0,<3.0",
    "typer>=0.12",
    # Unit 15 (TimeSeries profile import): openpyxl is already an
    # ANDES transitive dep but the substrate uses it directly for the
    # CSV→XLSX transcoding path, so pin it explicitly. python-multipart
    # is required by FastAPI to parse the ``UploadFile`` multipart body
    # on the profile upload route.
    "openpyxl>=3.1",
    "python-multipart>=0.0.9",
    # ANDES (which only requires a bare ``chardet``) sniffs the encoding of a
    # .raw file with it. Before chardet 6 a UTF-8 file whose only non-ASCII text
    # is a single accented letter was detected as Latin-1 or MacRoman, so a bus
    # name written by ``write_raw`` came back as mojibake.
    "chardet>=6",
]

[project.optional-dependencies]
# MCP (Model Context Protocol) stdio server for LLM agents: `tensa mcp`
mcp = [
    "mcp>=1.2",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6",
    # ``[tool.coverage.run]`` below uses ``patch`` and ``core``, which need coverage 7.10.
    "coverage>=7.10",
    "httpx>=0.27",
    # Capped at the next minor: [tool.ruff.lint] runs in preview mode, whose
    # behavior may change between ruff releases.
    "ruff>=0.6,<0.17",
    "mypy>=1.11",
    "websockets>=13",
]

[project.scripts]
tensa = "tensa.cli:app"

[project.urls]
Homepage = "https://github.com/Roger-GO/TENSA"
Documentation = "https://github.com/Roger-GO/TENSA"
Issues = "https://github.com/Roger-GO/TENSA/issues"

# Hatchling build target — src layout
[tool.hatch.build.targets.wheel]
packages = ["src/tensa"]
# Bundle the built SPA into the wheel under ``tensa/static/``. The
# wheel-build step expects ``../web/dist`` to exist; CI runs ``pnpm build``
# in ``web/`` before ``python -m build`` to populate it. If the directory
# is missing at build time, hatch fails loudly — that's the intended
# behavior so we never ship a wheel without the UI bundle.
force-include = { "../web/dist" = "tensa/static" }

[tool.hatch.build.targets.sdist]
include = [
    "src/tensa",
    "README.md",
    "ANDES_VERSIONS.md",
]

# ============================================================================
# Tooling
# ============================================================================

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# PLW1514 is still a preview rule and ruff cannot enable one preview rule on its
# own: ``preview = true`` also switches the selected stable rules (E, W, F, I, B,
# UP, SIM, C4) to their preview behavior. ``explicit-preview-rules`` only stops
# the prefixes below from selecting other preview rules, so PLW1514 is the one
# new rule. ruff is capped in the [dev] extra for the same reason; once PLW1514
# is stable, drop both settings and the cap.
preview = true
explicit-preview-rules = true
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "PLW1514",  # open()/read_text()/write_text() without encoding= (preview rule)
]
ignore = [
    "E501",  # line length — handled by formatter
    "B008",  # function calls in argument defaults — Typer's idiomatic pattern
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
files = ["src"]

[[tool.mypy.overrides]]
# ANDES has no type stubs; allow untyped imports. openpyxl likewise ships no
# stubs (the clone-on-write xlsx writer + the profiles route both import it).
# ``mcp`` is an OPTIONAL extra (the MCP server module) not installed by
# ``[dev]``, so its import is unresolved under the default CI type-check.
module = ["andes", "andes.*", "kvxopt", "kvxopt.*", "openpyxl", "openpyxl.*", "mcp.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# mcp_server.py is optional glue: without the ``[mcp]`` extra installed, the
# FastMCP tool decorators resolve to ``Any``, which --strict flags as untyped
# decorators. It is a thin, exercised wrapper over the HTTP API, so relax only
# this one check for this one module rather than requiring the optional dep in CI.
module = ["tensa.mcp_server"]
disallow_untyped_decorators = false


[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "acceptance: end-to-end acceptance tests (require running server + ANDES)",
    "integration: tests that spawn subprocesses or hit ANDES",
    "smoke: cross-platform smoke test, run on every OS in the CI matrix (pytest -m smoke)",
    "unit: pure-unit tests with no I/O",
]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]

[tool.coverage.run]
source_pkgs = ["tensa"]
# Most of the ANDES-facing code (core/worker.py, core/wrapper.py) runs in
# worker processes the session manager spawns, so measure subprocesses too.
patch = ["subprocess"]
# Line coverage through sys.monitoring costs about 10% on a worker-heavy test
# file; the default tracer doubled the run time once workers were measured too.
# (Needs Python 3.12+ and offers no branch coverage before 3.14, which is fine
# for line coverage.)
core = "sysmon"

[tool.coverage.report]
skip_empty = true
